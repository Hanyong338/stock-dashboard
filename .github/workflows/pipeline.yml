name: stock-youtube-pipeline

on:
  schedule:
    - cron: "0 * * * *" # 매시 정각 (UTC 기준, 1시간마다) — 유튜브·브리핑·캘린더
    # 시그널 스크리너용 추가 실행. UTC 23:30 = 한국시간 08:30 (장 시작 전).
    # 매시 정각 크론만으론 한국시간이 항상 정각이라 08:30 에 도는 실행이 없다.
    # 나머지 슬롯(10시·14시·17시)은 정각이라 위의 매시 크론이 덮는다.
    - cron: "30 23 * * *"
  workflow_dispatch: {} # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          # GEMINI_MODEL 을 지정하지 않으면 summarize.py 기본값인 gemini-3.5-flash 를 쓴다.
          # 비용을 낮추려면 여기에 GEMINI_MODEL: gemini-3.5-flash-lite 를 추가하면 된다.
        run: python scripts/pipeline.py

      - name: Commit and push updated data
        run: |
          git config user.name "stock-dashboard-bot"
          git config user.email "actions@github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "chore: update data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
