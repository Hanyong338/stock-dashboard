name: stock-youtube-pipeline

on:
  schedule:
    # 매시 정각 (UTC) — 유튜브 요약 / 당잠사 브리핑 / 캘린더 / 오늘의 주도 테마
    - cron: "0 * * * *"
    # 섹션 1~3 종목 선별용. UTC 06:50 = 한국시간 15:50 (정규장 마감 직후).
    # 매시 정각 크론만으론 한국시간이 항상 정각이라 15:50 에 도는 실행이 없다.
    - cron: "50 6 * * *"
    # 섹션 4 모닝 브레이크아웃용. UTC 00:32 = 한국시간 09:32 (장 시작 30분 직후).
    - cron: "32 0 * * 1-5"
  workflow_dispatch: {} # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 결제를 연결하지 않은 별도 프로젝트의 키. 선불 잔액이 떨어지면 자동으로 이 키로 넘어간다(무료 사용량).
          # 등록 안 돼 있으면 빈 값이라 전환 없이 지금처럼 동작한다.
          GEMINI_API_KEY_FREE: ${{ secrets.GEMINI_API_KEY_FREE }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          # GEMINI_MODEL 을 지정하지 않으면 summarize.py 기본값인 gemini-3.5-flash 를 쓴다.
          # 비용을 낮추려면 여기에 GEMINI_MODEL: gemini-3.5-flash-lite 를 추가하면 된다.
        run: python scripts/pipeline.py

      - name: Commit and push updated data
        run: |
          git config user.name "stock-dashboard-bot"
          git config user.email "actions@github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "chore: update data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
