name: stock-youtube-pipeline

on:
  schedule:
    # 20분마다 (UTC 0·20·40분) — 유튜브 요약 / 당잠사 브리핑 / 캘린더 / 오늘의 주도 테마.
    # 원래 매시 정각이었는데, 제미나이 무료 사용량이 구글 혼잡(503 high demand)으로 거절되는 시간대에
    # 밀린 영상을 더 자주 다시 시도하려고 20분으로 줄였다(2026-10-05). 비용은 그대로다
    # (새 영상만 자막을 받고, 밀린 영상은 저장해 둔 자막으로 재시도, 제미나이는 무료).
    - cron: "*/20 * * * *"
    # 섹션 1~3 종목 선별용. UTC 06:50 = 한국시간 15:50 (정규장 마감 직후).
    # 매시 정각 크론만으론 한국시간이 항상 정각이라 15:50 에 도는 실행이 없다.
    - cron: "50 6 * * *"
    # 섹션 4 모닝 브레이크아웃용. UTC 00:32 = 한국시간 09:32 (장 시작 30분 직후).
    - cron: "32 0 * * 1-5"
  workflow_dispatch: {} # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

# 실행이 겹치지 않게 한다. 앞 실행이 안 끝났으면 다음 실행은 기다렸다가 돈다(취소하지 않음).
# 간격이 20분이라 밀린 영상이 많을 때 겹칠 수 있고, 겹치면 같은 영상을 두 번 처리하거나 데이터 저장이 부딪힌다.
concurrency:
  group: stock-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 결제를 연결하지 않은 별도 프로젝트의 키(무료 사용량). 이 키를 먼저 쓰고, 무료 모델이 모두
          # 혼잡/한도일 때만 위 유료 키(선불)를 쓴다. 선불 잔액이 0 이면 유료 키는 거절될 뿐 돈은 안 나간다.
          GEMINI_API_KEY_FREE: ${{ secrets.GEMINI_API_KEY_FREE }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          # GEMINI_MODEL 을 지정하지 않으면 summarize.py 기본값인 gemini-3.5-flash 를 쓴다.
          # 비용을 낮추려면 여기에 GEMINI_MODEL: gemini-3.5-flash-lite 를 추가하면 된다.
        run: python scripts/pipeline.py

      - name: Commit and push updated data
        run: |
          git config user.name "stock-dashboard-bot"
          git config user.email "actions@github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "chore: update data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
