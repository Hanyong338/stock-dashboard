<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Steve's Econ 300</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<!-- app.js / style.css 를 수정하면 아래 v 값을 그날 날짜로 바꿀 것.
     안 바꾸면 브라우저가 옛날 파일을 계속 써서 수정이 반영 안 된 것처럼 보인다. -->
<link rel="stylesheet" href="style.css?v=20260920o" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">📈</span>
    <div class="brand-text">
      <h1>Steve's Econ 300</h1>
      <span class="brand-sub" id="brandSub">자동 리포트</span>
    </div>
  </div>
  <div class="meta">
    <span id="lastUpdated">불러오는 중...</span>
    <button id="refreshBtn" type="button">
      <svg class="icon-refresh" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.4-6.4L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.4 6.4L3 16"/><path d="M3 21v-5h5"/></svg>
      새로고침
    </button>
  </div>
</header>

<nav class="tabs" id="sectionTabs">
  <span class="tab-indicator" id="tabIndicator"></span>
  <button class="tab-btn active" data-tab="calendar">증시 캘린더</button>
  <button class="tab-btn" data-tab="briefing">미장 Briefing</button>
  <button class="tab-btn" data-tab="summaries">실시간 시황</button>
  <button class="tab-btn" data-tab="screening">기술적 분석</button>
</nav>

<main>
  <section id="tab-calendar" class="tab-panel active">
    <div class="cal-toolbar">
      <div class="cal-monthpick">
        <button id="calPrev" class="cal-nav" type="button" aria-label="이전 달">‹</button>
        <button id="calMonthBtn" class="cal-month" type="button" aria-haspopup="listbox">
          <span id="calMonthLabel">불러오는 중</span><span class="cal-caret">▾</span>
        </button>
        <button id="calNext" class="cal-nav" type="button" aria-label="다음 달">›</button>
      </div>
      <ul id="calMonthMenu" class="cal-monthmenu" role="listbox" hidden></ul>
      <div id="calFilters" class="cal-filters"></div>
    </div>

    <div class="cal-card">
      <div class="cal-dow">
        <span class="sun">일</span><span>월</span><span>화</span><span>수</span>
        <span>목</span><span>금</span><span class="sat">토</span>
      </div>
      <div id="calGrid" class="cal-grid"></div>
    </div>

    <div id="calAgenda" class="cal-agenda"></div>
    <p id="calEmpty" class="empty-state" hidden>캘린더 데이터를 불러오는 중입니다...</p>
  </section>

  <section id="tab-briefing" class="tab-panel">
    <!-- 첫 화면에서 스크롤 없이 '오늘의 결론'이 먼저 보이도록 당잠사 3줄 요약을 맨 위로 끌어올린다 -->
    <section id="todayVerdict" class="verdict" hidden>
      <div class="verdict-head">
        <h2>오늘의 결론</h2>
        <span id="verdictMeta" class="verdict-meta"></span>
      </div>
      <div id="verdictBody" class="verdict-body"></div>
    </section>

    <section id="morningBrief" class="mbrief" hidden>
      <div class="mbrief-head">
        <div class="mbrief-title">
          <h2>🇺🇸 Overnight → 🇰🇷 Korea</h2>
          <span id="mbriefAsOf" class="mbrief-asof"></span>
        </div>
        <a id="mbriefLink" class="yt-link" href="#" target="_blank" rel="noopener">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M23 12s0-3.9-.5-5.8c-.3-1-1.1-1.9-2.1-2.1C18.5 3.6 12 3.6 12 3.6s-6.5 0-8.4.5c-1 .3-1.8 1.1-2.1 2.1C1 8.1 1 12 1 12s0 3.9.5 5.8c.3 1 1.1 1.9 2.1 2.1 1.9.5 8.4.5 8.4.5s6.5 0 8.4-.5c1-.3 1.8-1.1 2.1-2.1.5-1.9.5-5.8.5-5.8zM9.9 15.6V8.4l6.3 3.6-6.3 3.6z"/></svg>
          당잠사 원본
        </a>
      </div>

      <nav id="mbriefNav" class="mbrief-nav"></nav>

      <div id="mbriefIndices" class="mbrief-indices"></div>

      <div id="mbriefEvents" class="mbrief-block"></div>
      <div id="mbriefNews" class="mbrief-block"></div>
      <div id="mbriefSectors" class="mbrief-block"></div>
      <div id="mbriefConnections" class="mbrief-block"></div>
      <div id="mbriefChecklist" class="mbrief-block"></div>
    </section>

    <p id="briefingEmpty" class="empty-state" hidden>브리핑 데이터를 불러오는 중입니다...</p>
  </section>

  <section id="tab-summaries" class="tab-panel">
    <div class="channel-tabs" id="channelTabs">
      <button class="channel-tab active" data-channel="">전체</button>
    </div>

    <div class="date-tabs" id="dateTabs">
      <button class="date-tab active" data-date="">전체 기간</button>
    </div>

    <div id="summaryList" class="summary-list">
      <p class="empty-state">데이터를 불러오는 중입니다...</p>
    </div>
  </section>

  <section id="tab-screening" class="tab-panel">
    <div id="screeningList" class="screening-list">
      <p class="empty-state">기술적 분석 기능은 아직 준비 중입니다. (다음 단계에서 추가 예정)</p>
    </div>
  </section>
</main>

<script src="app.js?v=20260920o"></script>
</body>
</html>
