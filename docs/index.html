<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>주식 유튜브 요약 대시보드</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">📈</span>
    <div class="brand-text">
      <h1>주식 유튜브 요약</h1>
      <span class="brand-sub">5개 채널 · 자동 리포트</span>
    </div>
  </div>
  <div class="meta">
    <span id="lastUpdated">불러오는 중...</span>
    <button id="refreshBtn" type="button">
      <svg class="icon-refresh" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.4-6.4L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.4 6.4L3 16"/><path d="M3 21v-5h5"/></svg>
      새로고침
    </button>
  </div>
</header>

<nav class="tabs" id="sectionTabs">
  <span class="tab-indicator" id="tabIndicator"></span>
  <button class="tab-btn active" data-tab="summaries">유튜브 요약</button>
  <button class="tab-btn" data-tab="screening">차트 스크리닝 결과</button>
</nav>

<main>
  <section id="tab-summaries" class="tab-panel active">
    <div id="dailyPicks" class="picks-box" hidden>
      <div class="picks-col picks-leading">
        <h2>🚀 오늘의 우수·주도 섹터</h2>
        <div id="leadingPicksList" class="picks-list"></div>
      </div>
      <div class="picks-col picks-watch">
        <h2>⚠️ 관망·주의 섹터</h2>
        <div id="watchPicksList" class="picks-list"></div>
      </div>
    </div>

    <div class="channel-tabs" id="channelTabs">
      <button class="channel-tab active" data-channel="">전체</button>
    </div>

    <div class="date-tabs" id="dateTabs">
      <button class="date-tab active" data-date="">전체 기간</button>
    </div>

    <div id="summaryList" class="summary-list">
      <p class="empty-state">데이터를 불러오는 중입니다...</p>
    </div>
  </section>

  <section id="tab-screening" class="tab-panel">
    <div id="screeningList" class="screening-list">
      <p class="empty-state">차트 패턴 스크리닝 기능은 아직 준비 중입니다. (다음 단계에서 추가 예정)</p>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
